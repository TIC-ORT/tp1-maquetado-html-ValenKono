<!DOCTYPE html>

                <div class="linea-bajo1"></div>
                <div class="linea-bajo2"></div>
                <div class="linea-bajo3"></div>

        </div>
        <div class="cuadro-inferior derecha">
            <div class="lineas-bajo-cuadro">
                <div class="linea-bajo1"></div>
